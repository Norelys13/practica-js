          headers: { 
            'Authorization:' 'Bearer rc_live_3c24d53a5c1c469084e973303a9c5d6e'
          }, 
        });

        if (!respuesta.ok){
          throw new Error(`No es posibel conectarse al servidor`);
        }

        const datos = await respuesta.json();
        console.log(datos);
      } catch (e){
        console.error(`No se pudo concretar la operacion ${e}`);
      }
    }
